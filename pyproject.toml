[project]
name = "nowcasting"
version = "0.1.0"
description = "Precipitation nowcasting on SEVIR (VIL) with deep learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=2.1",
    "pytorch-lightning>=2.6.6",
    "torch>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcasting"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
